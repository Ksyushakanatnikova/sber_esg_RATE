.page{padding-bottom:20px;min-height:100%}.page-head{height:66px;display:flex;gap:12px;align-items:center;padding:0 20px;background:var(--bg);position:sticky;top:0;z-index:4}.page-head h1{font-size:21px;letter-spacing:-.45px;font-weight:600;margin:0;flex:1}.back{background:none;padding:8px 6px 8px 0;display:grid;place-items:center}.back .icon{width:25px;height:25px}.ghost{background:#edf3ef;border-radius:13px;padding:9px;color:#39594a;display:flex;align-items:center;justify-content:center}.sect{background:#fff;border-radius:24px;margin:11px 11px;padding:23px 21px}.sect.flush{padding:0;overflow:hidden}.sect-title{font-size:21px;line-height:1.23;font-weight:600;letter-spacing:-.55px;margin:0 0 18px}.sub{color:#818584;font-size:13px;line-height:1.5}.tiny{font-size:11px;color:#919798}.strong{font-weight:600}.muted{color:#808782}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.column{display:flex;flex-direction:column}.gap8{gap:8px}.gap12{gap:12px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.no-margin{margin:0}.kicker{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--green);font-weight:800}.h2{font-size:23px;font-weight:700;letter-spacing:-.75px;line-height:1.13}.h3{font-size:17px;font-weight:700;letter-spacing:-.35px;line-height:1.28}.lead{font-size:15px;line-height:1.48}.rule{height:1px;background:#e9edeb;margin:17px 0}.btn{min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 17px;font-weight:600;font-size:16px;background:#edf3ee;color:#1c3d29;width:100%;transition:transform .15s ease,filter .15s}.btn:active{transform:scale(.987)}.btn.primary{background:#138d2e;color:white;box-shadow:0 3px 9px rgba(20,145,45,.1)}.btn.black{background:#102d25;color:white}.btn.outline{background:white;border:1px solid #e3ebe6;color:#1a3825}.btn.small{min-height:36px;width:auto;border-radius:11px;padding:7px 12px;font-size:13px}.bt /* Макет по референсам СберБанк Онлайн: белые панели, серые плитки, горизонтальные списки. */
:root{--green:#0e9c3b;--bg:#f2f2f2;--ink:#131313;--border:#e8e8e8;--radius:24px;--muted:#777}
html,body{background:#f2f2f2;color:#101010;font-family:'Open Sans',Arial,sans-serif}
.status{height:58px;min-height:58px;padding:12px 26px 7px;font-weight:600;font-size:15px}
.island{width:174px;height:34px;top:8px;background:#020202;border-radius:22px}
.bottom{min-height:66px;padding:8px 2px 10px;background:#fbfbfb;border-top:1px solid #ededed}
.bottom button{font-size:10px;gap:4px;color:#a4a4a4}
.bottom button.active{color:#0b9636}
.bottom button .icon{stroke-width:1.8}
.viewport{background:#f2f2f2}
.page{padding-bottom:17px;background:#f2f2f2}
.page-head{height:66px;padding:0 17px;background:#f2f2f2;position:relative}
.page-head h1{font-size:19px;letter-spacing:0;font-weight:700}
.sect{border-radius:24px;margin:9px 8px 12px;padding:22px 16px;background:#fff}
.sect-title{font-size:21px;line-height:1.28;margin-bottom:17px;letter-spacing:-.3px;font-weight:700}
.h2{font-size:24px;font-weight:700;letter-spacing:-.4px}
.h3{font-size:17px;font-weight:700;letter-spacing:0}
.sub{font-size:13px;color:#777}
.btn{font-size:16px;font-weight:600;min-height:52px;border-radius:13px}
.btn.primary{background:#159534;box-shadow:none;color:#fff}
.icon-square{background:#f4f4f4;color:#119a37;border-radius:13px}
.tile{border-radius:15px;background:#f4f4f4}
.tier-row,.freq-btn,.choice-card,.stat-box{border-radius:15px}
.tag.gray,.chip{background:#f1f1f1}
/* Стандартная шапка с поиском */
.top-search{gap:13px;width:100%;align-items:center}
.avatar{height:36px;width:36px;min-width:36px;font-size:14px;background:linear-gradient(130deg,#8fadb1,#cead9f);border:2px solid #fff;box-shadow:0 0 0 1px #e9e9e9}
.searchbar{background:#ececec;height:39px;gap:8px;border-radius:14px;font-size:14px;color:#858585;min-width:0}
.searchbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apps-switch{width:36px;min-width:36px;height:36px;display:grid;place-items:center;background:transparent;color:#111;font-weight:700;font-size:29px;line-height:1}
.apps-switch span{display:block;transform:rotate(90deg)}
.hero-home{background:linear-gradient(130deg,#b0dfcc 0%,#daf4e4 62%,#d7e9e5 100%);padding:16px 16px 19px}
.life-search{padding:13px 16px 15px;background:#f8f8f8}
.wallet-title{margin:27px 1px 17px}
.more-arrow{color:#636363}
.wallet-cards{gap:11px;margin-right:-16px}
.wallet-card{height:135px;min-width:172px;width:172px;border-radius:16px;padding:15px;background:#fff}
.wallet-card:first-child{min-width:61px;width:61px}
.wallet-card.wallet-qr{min-width:62px;width:62px}
.wallet-micro{font-size:11px;color:#868686}
.wallet-card .balance{font-size:20px}
/* Горизонтальные нативные карусели */
.rail-wrapper,.tile-row{display:flex;gap:9px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;padding-bottom:2px;margin-right:-16px;touch-action:pan-x}
.rail-wrapper::-webkit-scrollbar,.tile-row::-webkit-scrollbar{display:none}
.offer-card{position:relative;text-align:left;flex:0 0 90%;height:234px;border-radius:18px;overflow:hidden;color:white;padding:19px 17px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;scroll-snap-align:start;background:#003b31}
.offer-feature{background:linear-gradient(145deg,#074b38 5%,#006d42 60%,#0fa958 100%)}
.offer-next{background:linear-gradient(145deg,#204a6e,#1e9473)}
.offer-shape{position:absolute;right:-2px;top:-32px;font-size:210px;color:#66cc9270;font-weight:300;line-height:1;transform:rotate(-18deg);pointer-events:none}
.offer-eyebrow{font-size:10px;letter-spacing:.5px;font-weight:700;color:#caefda;position:relative}
.offer-head{font-size:23px;font-weight:700;line-height:1.17;letter-spacing:-.4px;position:relative;max-width:97%}
.offer-sub{font-size:13px;line-height:1.45;color:#e1f4e8;position:relative}
.offer-button{margin-top:auto;border-radius:12px;background:#fff;color:#222;font-size:13px;font-weight:700;padding:7px 12px;position:relative}
.sber-tile{flex:0 0 69%;min-width:0;background:#f5f5f5;color:#111;border-radius:15px;height:166px;padding:18px 16px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:9px;text-align:left;scroll-snap-align:start;position:relative}
.sber-tile.sber-square{flex-basis:63%;height:158px}
.sber-tile-heading{font-size:18px;font-weight:600;line-height:1.18}
.sber-tile-icon{position:absolute;right:16px;top:14px;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:#109938;color:#fff}
.sber-tile-icon .icon{width:23px;height:23px}
.sber-tile-value{font-size:16px;line-height:1.32;font-weight:600;margin-top:auto;max-width:100%}
.sber-tile-bottom{font-size:12px;color:#7a7a7a;line-height:1.25;margin-top:auto}
.sber-tile-value+.sber-tile-bottom{margin-top:0}
.native-illustration{display:grid;place-items:center;width:100%;height:88px;margin:-6px 0 1px;border-radius:13px;background:#e2f7ec;color:#169541;overflow:hidden}
.native-illustration .icon{width:50px;height:50px;stroke-width:1.5}
.pink-illu{background:#fbe9ed;color:#c63e61}
.blue-illu{background:#dbece9;color:#137c92}
.sber-tile:has(.native-illustration){height:196px}
.native-list{display:flex;flex-direction:column}
.native-row{min-height:66px;display:flex;gap:16px;padding:13px 2px;align-items:center;font-size:16px;font-weight:600;text-align:left;background:white;border-bottom:1px solid #e9e9e9;color:#141414;width:100%}
.native-row:last-child{border-bottom:none}
.native-icon{display:grid;place-items:center;width:38px;height:38px;color:#15963b}
.native-icon .icon{width:25px;height:25px}
.native-chevron{color:#a8a8a8;font-size:25px;margin-left:auto}
.native-tabs{display:flex;gap:12px;align-items:center;padding:5px 17px 3px;font-size:14px;color:#797979}
.native-tabs span{padding:11px 13px}
.native-tabs .selected{background:#fff;border-radius:12px;color:#111;font-weight:600}
/* Подписка по образцу страницы СберПрайм */
.club-top-art{height:194px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 30%,#dcf4e9 0,#e6eeeb 40%,#f2f2f2 79%);isolation:isolate}
.club-orbit{position:absolute;border-radius:50%;filter:drop-shadow(0 15px 14px #124e3829)}
.orbit-a{width:160px;height:130px;top:25px;left:calc(50% - 96px);background:linear-gradient(125deg,#10bb6a,#065e44);transform:rotate(-25deg)}
.orbit-b{width:111px;height:103px;top:31px;left:calc(50% + 8px);background:linear-gradient(125deg,#0c73b0,#00b68a);transform:rotate(30deg)}
.orbit-c{width:95px;height:54px;top:108px;left:calc(50% - 67px);background:linear-gradient(120deg,#06a747,#7ee766);transform:rotate(-16deg);border-radius:45px}
.club-art-symbol{font-size:68px;position:absolute;color:#f7fff9;left:calc(50% - 42px);top:34px;text-shadow:0 3px 15px #245f5c80}
.club-art-label{position:absolute;left:50%;transform:translateX(-50%) rotate(-10deg);top:125px;letter-spacing:1px;white-space:nowrap;padding:7px 13px;border-radius:10px;color:white;background:#0aa744;font-size:11px;font-weight:700;box-shadow:0 3px 9px #05382633}
.club-intro{position:relative;background:#fff;border-radius:24px;margin:-13px 8px 13px;padding:36px 16px 23px;z-index:1}
.club-intro h1{text-align:center;font-size:26px;letter-spacing:-.6px;margin:0;font-weight:700}

function tiers(){const active=currentTier();return `<div class="page">${head('Уровни клуба')}${section(`<p class="sub no-margin">Все участники оплачивают одну подписку. Более высокие уровни становятся доступны за подтвержденную активность и стаж.</p><div class="column gap8 mt16">${tnames.map((name,i)=>`<button class="tier-row ${s.subscribed&&i===active?'current':''}" data-action="tier" data-tier="${i}"><div class="tier-head"><div><div class="tier-name">${name}</div><div class="tier-range">${tranges[i]}</div></div>${s.subscribed&&i===active?'<span class="tag">Ваш уровень</span>':icon('right')}</div><div class="sub mt12">${i===0?'Рейтинг, скидки и мероприятия':i===1?'3% кешбэка, расширенные предложения':'5% кешбэка, закрытое сообщество и консультации'}</div></button>`).join('')}</div><div class="mt16">${btn('Как начисляются баллы','sheet','outline','data-sheet="info"')}</div>`,'Ваш путь')}</div>`}
function tierDetail(i){const list=[['Рейтинг и история участия','Подборка ESG-проектов по интересам','Базовые партнерские скидки','Одно групповое тематическое онлайн-мероприятие в месяц','Информация об ответственных инвестициях'],['Все преимущества Базового уровня','3% кешбэка бонусами СберСпасибо на выбранные ESG-покупки (до 500 бонусов в месяц)','Расширенные партнерские скидки','Два групповых онлайн-мероприятия в месяц','Ранняя регистрация на мероприятия','Аналитика и групповые встречи по ответственным инвестициям'],['Все преимущества уровня Про','5% кешбэка бонусами СберСпасибо на выбранные ESG-покупки (до 1 000 бонусов в месяц)','Приоритетный доступ к закрытым мероприятиям','Закрытое ESG-сообщество','Персональный годовой ESG-отчет','Консультация по ответственным инвестициям в пределах лимита','Расширенные предложения партнеров','Персональная поддержка по вопросам клуба']];return `<div class="page">${head(`Уровень «${tnames[i]}»`)}${section(`<div class="row between"><div><div class="h2">${tnames[i]}</div><div class="sub mt8">${tranges[i]}</div></div><div class="icon-square" style="width:60px;height:60px">${icon(i===2?'medal':i===1?'gift':'leaf','lg')}</div></div><div class="rule"></div><div class="benefit-list">${list[i].map(v=>`<div class="benefit-item">${icon('checkcircle')}<span>${v}</span></div>`).join('')}</div><div class="rule"></div><div class="h3">Условия поддержания</div><p class="sub mt8">${['От одного подтвержденного ESG-действия в месяц','От двух подтвержденных ESG-действий в месяц','От трех подтвержденных ESG-действий в двух направлениях за месяц'][i]}</p>${i>0?`<div class="demo-note mt12">Для перехода требуется не менее ${i===1?3:12} месяцев подписки и рейтинг от ${i===1?40:75} баллов.</div>`:''}<div class="mt20">${btn(s.subscribed?'Мой ESG-клуб':'Подключить клуб',s.subscribed?'dashboard':'onboard')}</div>`)}</div>`}
function benefits(){const t=currentTier();const all=[['Партнерские предложения','Базовые скидки на тематические мероприятия','gift',0],['Онлайн-встречи','Групповые ESG-мероприятия','cal',0],['Повышенный кешбэк 3%','До 500 бонусов за месяц на выбранные покупки','coins',1],['Ранняя регистрация','Запись на мероприятия с ограниченными местами','cal',1],['Повышенный кешбэк 5%','До 1 000 бонусов в месяц на выбранные покупки','coins',2],['Закрытое сообщество','Специальные встречи и обсуждение проектов','users',2],['Инвестиционная консультация','В пределах установленного лимита','chart',2]];return `<div class="page">${head('Привилегии')}${section(`<div class="row between"><div><div class="h3">Ваш уровень: ${getTierText()}</div><div class="sub mt8">Условия предложения зависят от уровня</div></div><span class="tag">${calculate().total} / 100</span></div><div class="rule"></div><div class="plain-list">${all.map(([title,sub,ic,req])=>`<div class="plain-line" style="cursor:default"><div class="icon-square" style="${req>t?'background:#f1f2f1;color:#9da49f':''}">${icon(req>t?'lock':ic)}</div><div class="text"><div class="name">${title}</div><div class="desc">${sub}</div></div><span class="tag ${req>t?'gray':''}">${req>t?tnames[req]:'Доступно'}</span></div>`).join('')}</div><div class="caution mt16">Скидки, ставки кешбэка и партнеры приведены как проектные условия. Реальные соглашения не оформлены через этот прототип.</div>`,'Что доступно')}</div>`}
function history(){const a=[...s.actions].sort((x,y)=>String(y.date).localeCompare(String(x.date)));const dformat=v=>new Date(v+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});return `<div class="page">${head('История участия')}${section(`<div class="h3">Ваши ESG-действия</div><div class="sub mt8">Рейтинг учитывает подтвержденную активность за последние 12 месяцев</div><div class="rule"></div>${a.length?a.map(x=>`<div class="timeline-item"><div class="history-date">${dformat(x.date)}</div><div class="timeline-name">${esc(x.title)}</div><div class="timeline-sub">${esc(x.dir)} · ${x.demo?'демонстрационное действие':'подтверждено'}</div></div>`).join(''):`<div style="padding:20px 0;text-align:center">${icon('cal','lg')}<div class="h3 mt12">Пока нет действий</div><div class="sub mt8">Выберите инициативу и посмотрите, как обновится рейтинг.</div></div>`}<div class="mt16">${btn('Открыть каталог проектов','nav','outline','data-page="catalog"')}</div>`,'История клуба')}</div>`}
function certificate(){let count=s.actions.length;return `<div class="page">${head('Мой сертификат')}${section(`<div class="certificate"><div class="cert-badge">ESG-КЛУБ СБЕРА · ДЕМО</div><div class="mt16">${icon('medal','lg')}</div><h3>Сертификат участия</h3><div class="cert-copy">Подтверждает участие в демонстрационных социальных и экологических инициативах клуба</div><div class="cert-name">${esc(s.certName||'Участник ESG-клуба')}</div><div class="cert-dash"></div><div class="row between"><div style="text-align:left"><div class="tiny">Действий в прототипе</div><div class="strong mt8">${count}</div></div><div style="text-align:right"><div class="tiny">Рейтинг</div><div class="strong mt8">${calculate().total} из 100</div></div></div><div class="cert-copy mt20">Макет сертификата. Не является официальным документом банка.</div></div>${count?`<div class="mt20"><p class="form-label">Имя на сертификате</p><input id="certName" class="form-field" maxlength="64" placeholder="Как вас указать?" value="${esc(s.certName)}" /><button class="btn primary mt12" data-action="download">${icon('download','sm')} Скачать сертификат (SVG)</button></div>`:`<div class="caution mt16">Сертификат доступен после первого демонстрационного действия. Выберите проект или загрузите пример профиля участника.</div><div class="mt12">${btn('Выбрать проект','nav','outline','data-page="catalog"')}</div>`}`,'Подтверждение участия')}</div>`}
function render(){if(!s.subscribed&&['dashboard','benefits','history','certificate'].includes(page))page='landing'; const v={home,life,payments,services,landing,onboard,confirmation,dashboard,catalog,detail,tiers,benefits,history,certificate,savings:()=>simple('savings'),credits:()=>simple('credits')}[page];app.innerHTML=v?v():landing();bottom();overlay.innerHTML='';app.scrollTop=0;persist()}
function showToast(str){let el=document.createElement('div');el.className='toast';el.textContent=str;overlay.innerHTML='';overlay.appendChild(el);if(toastId)clearTimeout(toastId);toastId=setTimeout(()=>{if(overlay.contains(el))el.remove()},2500)}
function modal(title,body){sheet=title;overlay.innerHTML=`<div class="bottom-sheet" data-action="dismiss"><div class="sheet-body" data-stopsheet="1"><div class="row between"><h2 class="sheet-title">${title}</h2><button class="sheet-close" data-action="dismiss">${icon('close','sm')}</button></div>${body}</div></div>`}
function demoData(mode){let a=mode==='proplus'?[['Пожертвование бонусами','Благотворительность',-5],['Волонтерское мероприятие','Социальные инициативы',-4],['Поддержка проекта СберВместе','Благотворительность',-3],['Экологическое мероприятие','Экология',-2],['Пожертвование бонусами','Благотворительность',-1],['Волонтерское мероприятие','Социальные инициативы',0],['Поддержка проекта СберВместе','Благотворительность',0],['Экологическое мероприятие','Экология',0]]:[['Поддержка проекта СберВместе','Благотворительность',-2],['Экологическая акция','Экология',-1],['Пожертвование бонусами','Благотворительность',0],['Участие в экопроекте','Экология',0]];s.subscribed=true;s.joinedMonths=mode==='proplus'?13:4;s.actions=a.map((v,i)=>({id:'sample-'+mode+'-'+i,title:v[0],dir:v[1],date:dateOffset(v[2]),demo:true}));s.demoTier=mode;save();stack=[];page='dashboard';render()}
function addAction(title,dir,kind){if(kind&&s.actions.some(a=>a.kind===kind&&monthId(a.date)===monthId(new Date().toISOString().slice(0,10)))){overlay.innerHTML='';showToast('Такое действие уже учтено в этом месяце');return;}s.actions.push({kind,id:'action-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title,dir,date:new Date().toISOString().slice(0,10),demo:true});save();overlay.innerHTML='';modal('Действие добавлено',`<div class="success-graphic">${icon('checkcircle','lg')}</div><div class="h3" style="text-align:center">${esc(title)}</div><div class="sub mt12" style="text-align:center">Это демонстрационное подтверждение. Рейтинг и история обновлены, реальные операции не выполнялись.</div><div class="row between mt20" style="background:#f4f8f4;border-radius:13px;padding:13px"><span class="muted">Ваш рейтинг</span><strong>${calculate().total} из 100</strong></div><div class="mt16">${btn('Вернуться в ESG-клуб','dashboard')}</div>`)}
function openDonate(){modal('Поддержать проект',`<p class="sub">Выберите количество бонусов для демонстрации пожертвования. Реальные бонусы не списываются.</p><div class="counter-row"><button class="counter-btn" data-action="amount" data-delta="-100">−</button><div style="font-size:24px;font-weight:700"><span id="amountDisplay">${bonusAmount}</span> <span class="sub">бонусов</span></div><button class="counter-btn" data-action="amount" data-delta="100">+</button></div><div class="caution mt12">Это имитация участия. Реальное пожертвование через прототип не производится.</div><div class="mt16">${btn('Подтвердить демо-действие','completeDonate')}</div>`)}
function eventModal(which){const ec=which==='volunteer';modal(ec?'Волонтерское мероприятие':'Экологическая акция',`<div class="detail-illustration ${ec?'':'amber'}" style="height:96px">${icon(ec?'users':'leaf','lg')}</div><div class="h3 mt16">${ec?'Помощь на городском мероприятии':'Участие в экологической акции'}</div><p class="sub mt8">${ec?'Пример мероприятия, которое может быть доступно через Добро.рф после интеграции.':'Пример природоохранного мероприятия в каталоге клуба.'}</p><div class="info-row">${icon('cal')}<span>Даты и доступность демонстрационные</span></div><div class="caution mt12">Регистрация и участие в реальном мероприятии здесь не выполняются.</div><div class="mt16">${btn('Отметить участие (демо)','completeEvent','primary',`data-type="${which}"`)}</div>`)}
function introInvest(){modal('Ответственные инвестиции',`<p class="sub">В ESG-клубе представлены образовательные материалы об инструментах ответственного инвестирования, их финансовых рисках и ESG-характеристиках.</p><div class="info-row">${icon('chart')}<span>Сравнение финансовых характеристик и ESG-критериев</span></div><div class="info-row">${icon('book')}<span>Аналитические обзоры и встречи с экспертами</span></div><div class="caution mt12">Прототип не позволяет покупать ценные бумаги и не гарантирует доходность.</div><div class="mt16">${btn('Понятно','dismiss','outline')}</div>`)}
function ratingModal(){const r=calculate();modal('Как считается рейтинг',`<div class="sub">Рейтинг за последние 12 месяцев определяется по подтвержденным ESG-действиям. Размер пожертвований не влияет на баллы.</div><div class="stat-grid mt16"><div class="stat-box"><div class="stat-value">${Math.round(50*Math.min(r.n,6)/6)}</div><div class="stat-label">из 50 · частота</div></div><div class="stat-box"><div class="stat-value">${Math.round(30*Math.min(r.m,6)/6)}</div><div class="stat-label">из 30 · регулярность</div></div><div class="stat-box"><div class="stat-value">${5*r.d}</div><div class="stat-label">из 20 · направления</div></div></div><div class="rule"></div><div class="info-row">${icon('checkcircle')}<span>До 50 баллов за 6 учитываемых действий</span></div><div class="info-row">${icon('checkcircle')}<span>До 30 баллов за активность в 6 разных месяцах</span></div><div class="info-row">${icon('checkcircle')}<span>По 5 баллов за каждое из 4 ESG-направлений</span></div><div class="mt16">${btn('Посмотреть уровни','nav','outline','data-page="tiers"')}</div>`)}
function dlCertificate(){const input=$('#certName');if(input){s.certName=input.value.trim().slice(0,64);save()}const name=esc(s.certName||'Участник ESG-клуба'),count=calculate().n,score=calculate().total;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750"><rect width="1100" height="750" fill="#f8fcf9"/><rect x="35" y="35" width="1030" height="680" rx="30" fill="none" stroke="#71b984" stroke-width="3"/><circle cx="550" cy="135" r="42" fill="#e5f7e9"/><path d="M550 105l9 21 23 2-17 15 5 23-20-12-20 12 5-23-17-15 23-2z" fill="#158f37"/><text x="550" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" letter-spacing="5" fill="#218a40">ESG-КЛУБ СБЕРА · ПРОТОТИП</text><text x="550" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="54" fill="#1e3025">Сертификат участия</text><text x="550" y="412" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" fill="#1e3025">${name}</text><text x="550" y="488" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" fill="#6b776e">Демонстрационные ESG-действия: ${count} · Рейтинг: ${score}/100</text><line x1="250" x2="850" y1="547" y2="547" stroke="#c9dfce"/><text x="550" y="617" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#69806e">Макет. Не является официальным документом.</text></svg>`;const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='esg-club-certificate-demo.svg';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);showToast('Демо-сертификат сохранен')}
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-action]');if(!e)return;if(e.closest('[data-stopsheet]')&&e.dataset.action==='dismiss'&&e!==ev.target.closest('[data-action]'))return;const a=e.dataset.action;ev.preventDefault();
switch(a){case'nav':go(e.dataset.page);break;case'back':back();break;case'open-club':go(s.subscribed?'dashboard':'landing');break;case'onboard':go('onboard');break;case'confirm':if(s.selected.length)go('confirmation');else showToast('Выберите хотя бы один формат');break;case'activate':s.subscribed=true;s.joinedMonths=0;s.actions=[];s.demoTier='none';save();stack=[];page='dashboard';render();break;case'dashboard':go('dashboard');break;case'interest':{const id=e.dataset.id;s.selected=s.selected.includes(id)?s.selected.filter(x=>x!==id):[...s.selected,id];save();render();break}case'frequency':s.frequency=e.dataset.id;save();render();break;case'sample':demoData(e.dataset.demo);break;case'reset':if(window.confirm('Сбросить демонстрационный профиль и вернуться на главный экран?')){s={...defaultState};stack=[];page='home';save();render()}break;
case'filter':catalogFilter=e.dataset.id;render();break;case'detail':detailId=e.dataset.id;go('detail');break;case'tier':{const idx=Number(e.dataset.tier);go('tier'+idx);break}case'sheet':ratingModal();break;case'dismiss':overlay.innerHTML='';break;case'donate':bonusAmount=100;openDonate();break;case'amount':bonusAmount=Math.max(100,Math.min(10000,bonusAmount+Number(e.dataset.delta)));if($('#amountDisplay'))$('#amountDisplay').textContent=bonusAmount;break;case'completeDonate':{if(!s.subscribed){overlay.innerHTML='';showToast('Сначала подключите ESG-клуб в демо-режиме');go('landing');break}addAction(`Пожертвование ${bonusAmount} бонусов (демо)`,'Благотворительность','bonus');break}case'volunteer':case'ecology':eventModal(a);break;case'completeEvent':if(!s.subscribed){overlay.innerHTML='';go('landing');break}addAction(e.dataset.type==='volunteer'?'Волонтерское мероприятие (демо)':'Экологическая акция (демо)',e.dataset.type==='volunteer'?'Социальные инициативы':'Экология',e.dataset.type);break;
case'education':modal('Обучающая программа',`<div class="h3 mt12">ESG: как участвовать осознанно</div><p class="sub mt12">В демонстрации обучение завершается одним нажатием. В рабочем продукте учитывается только подтвержденное прохождение курса.</p><div class="caution mt12">Это демонстрация, реальный образовательный сертификат не выдается.</div><div class="mt16">${btn('Завершить демо-программу','completeEducation')}</div>`);break;case'completeEducation':if(!s.subscribed){overlay.innerHTML='';go('landing');break}addAction('Завершена ESG-программа (демо)','Социальные инициативы','education');break;case'investInfo':introInvest();break;case'openDobro':window.open('https://dobro.ru/','_blank','noopener,noreferrer');break;case'download':dlCertificate();break;
}});
const oldGo=go; // details are rendered through the same navigation stack
const originalRender=render;
render=function(){if(/^tier[012]$/.test(page)){app.innerHTML=tierDetail(Number(page.slice(-1)));bottom();overlay.innerHTML='';app.scrollTop=0;persist();return}originalRender()};
render();
})();
</script>
</body>
</html>
